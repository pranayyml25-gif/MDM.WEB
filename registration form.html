<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h2>Registration Form</h2>

  

        <fieldset>
            <legend><b>Student Details</b></legend>

            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="firstname" placeholder="Enter your first name" required>
            <br><br>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lastname" placeholder="Enter your last name" required>
            <br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <br><br>

            <label for="contact">Contact Number:</label>
            <input type="tel" id="contact" name="contact" placeholder="Enter your contact number" required>
            <br><br>

            <label>Nationality:</label><br>

            <input type="radio" id="indian" name="nationality" value="Indian" required>
            <label for="indian">Indian</label>

            <input type="radio" id="other" name="nationality" value="Other">
            <label for="other">Other</label>

            <input type="radio" id="pakistani" name="nationality" value="Pakistani">
            <label for="pakistani">Pakistani</label>

        </fieldset>
        

        <br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    

</body>
</html>
